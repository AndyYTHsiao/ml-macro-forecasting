[project]
name = "ml-macro-forecasting"
version = "0.1.0"
description = "Machine learning forecasting of macroeconomic indicators and comparison with analyst forecasts."
readme = "README.md"
requires-python = ">=3.13"
keywords = ["machine learning", "macroeconomics", "forecasting", "time series"]
dependencies = [
    "cmaes>=0.12.0",
    "optuna>=4.5.0",
    "pandas>=2.3.3",
    "safetensors>=0.6.2",
    "scikit-learn>=1.7.2",
    "torch>=2.8.0",
    "xgboost>=3.0.5",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
]
